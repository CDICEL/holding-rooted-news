<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Rooted News</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1210" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230d8a4e'/%3E%3Cg color='%23fff' transform='translate(0 -1)'%3E%3Cpath d='M16 27V14.5' stroke='currentColor' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M16 18c0-5 3.4-8.4 8.6-8.4 0 5.1-3.4 8.4-8.6 8.4Z' fill='currentColor'/%3E%3Cpath d='M16 15.5c0-4-2.7-6.6-6.8-6.6 0 4 2.7 6.6 6.8 6.6Z' fill='currentColor'/%3E%3C/g%3E%3C/svg%3E">
<script>
// the reader's saved Light or Dark choice on rooted.news, same key the app uses
(function(){try{var m=localStorage.getItem('rooted_mode');if(m==='light'||m==='dark'){document.documentElement.setAttribute('data-theme',m);document.querySelector('meta[name="color-scheme"]').content=m}}catch(e){}})();
</script>
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:500 800;font-stretch:100%;font-display:swap;src:url(/fonts/bricolage-grotesque-latin.woff2) format("woff2")}
@font-face{font-family:"Public Sans";font-style:normal;font-weight:400 700;font-display:swap;src:url(/fonts/public-sans-latin.woff2) format("woff2")}
:root{
  --bg:#ffffff; --bg2:#f4f6f5; --fg:#131916; --muted:#616d67; --line:#e1e6e3; --line2:#cbd3cf;
  --accent:#097a43; --accent-ink:#ffffff;
  --display:"Bricolage Grotesque","Archivo Black","Helvetica Neue",Arial,sans-serif;
  --body:"Public Sans","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1210; --bg2:#141a17; --fg:#e9edea; --muted:#9aa69f; --line:#222b26; --line2:#33403a;
  --accent:#3bc980; --accent-ink:#06130c; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1210; --bg2:#141a17; --fg:#e9edea; --muted:#9aa69f; --line:#222b26; --line2:#33403a;
  --accent:#3bc980; --accent-ink:#06130c; color-scheme:dark }
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.top{padding-top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1400px;margin:0 auto;display:flex;align-items:center;height:58px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;white-space:nowrap;color:var(--fg)}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand .mark svg{width:24px;height:24px}
.brand .light{font-weight:500;color:var(--muted)}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:clamp(40px,12vh,120px) 16px 64px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,5.4vw,40px);line-height:1.08;letter-spacing:-.02em;text-wrap:balance;margin:0 0 14px}
.lost{font-size:17px;color:var(--muted);margin:0}
.here{margin:40px 0 10px;font-size:13px;font-weight:600;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
li a{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;color:var(--fg);text-decoration:none;font-weight:700;font-size:16px}
li a span{color:var(--muted);font-weight:500;font-size:15px}
li a:hover b,li a:focus-visible b{color:var(--accent)}
li a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" aria-label="Rooted News"><span class="mark"><svg viewBox="0 0 32 32" aria-hidden="true"><g transform="translate(0 -1)"><path d="M16 27V14.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M16 18c0-5 3.4-8.4 8.6-8.4 0 5.1-3.4 8.4-8.6 8.4Z" fill="currentColor"/><path d="M16 15.5c0-4-2.7-6.6-6.8-6.6 0 4 2.7 6.6 6.8 6.6Z" fill="currentColor"/></g></svg></span><span class="wm">rooted<span class="light">.news</span></span></div>
</div></header>
<main>
  <h1>Rooted News is offline for now. We will be back shortly.</h1>
  <p class="lost">Nothing is lost.</p>
  <p class="here">Until we are back, we are posting here:</p>
  <ul>
    <li><a href="https://bsky.app/profile/rooted.news" rel="noopener"><b>Bluesky</b><span>@rooted.news</span></a></li>
  </ul>
</main>
</body>
</html>
